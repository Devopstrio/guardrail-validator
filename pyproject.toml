[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-validator"
version = "1.0.0"
description = "Enterprise LLM Safety Guardrails, PII Sanitizer & Prompt Injection Interceptor Engine"
authors = [{ name = "Devopstrio", email = "engineering@devopstrio.co.uk" }]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.5.0",
    "httpx>=0.26.0",
    "pyyaml>=6.0.1",
    "tabulate>=0.9.0",
    "structlog>=24.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
